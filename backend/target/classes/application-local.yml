spring:
  datasource:
    url: jdbc:h2:mem:petstore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      data-locations: classpath:data-local.sql

app:
  jwt:
    secret: testsecretkeytestsecretkeytestse

stripe:
  secret: test
  webhookSecret: test